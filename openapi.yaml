openapi: 3.0.3
info:
  title: Cozy Chat Backend API
  version: 1.0.0
  description: REST API for authentication and messaging in Cozy Chat.
servers:
  - url: http://localhost:8080
tags:
  - name: Auth
  - name: Data
  - name: Messages
paths:
  /api/register:
    post:
      tags: [Auth]
      summary: Register a new user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: User registered successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
              examples:
                success:
                  value:
                    message: user registered successfully
        '400':
          description: Invalid request or validation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                invalidRequest:
                  value:
                    error: invalid request
                validationFailed:
                  value:
                    error: "validation failed: username must be >=3 chars, password >=8 chars"
        '409':
          description: User already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: user with this username is already exists
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: internal server error

  /api/login:
    post:
      tags: [Auth]
      summary: Login and receive JWT token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          description: Invalid request body
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: invalid request
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                userNotFound:
                  value:
                    error: user not found
                invalidPassword:
                  value:
                    error: invalid password
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: internal server error

  /api/public:
    get:
      tags: [Data]
      summary: Public endpoint
      responses:
        '200':
          description: Public endpoint response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
              example:
                message: Публичный эндпоинт, доступен без JWT токена

  /api/private:
    get:
      tags: [Data]
      summary: Private endpoint
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Private endpoint response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrivateDataResponse'
              example:
                message: Приватный эндпоинт, доступен только с JWT токеном
                user: leonid
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                missingAuthorizationHeader:
                  value:
                    error: missing authorization header
                invalidAuthorizationHeader:
                  value:
                    error: invalid authorization header
                invalidOrExpiredToken:
                  value:
                    error: invalid or expired token
                unauthorized:
                  value:
                    error: unauthorized

  /api/messages:
    post:
      tags: [Messages]
      summary: Send a message to another user
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendMessageRequest'
      responses:
        '201':
          description: Message sent successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
              example:
                message: message sent successfully
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                invalidRequest:
                  value:
                    error: invalid request
                validationFailed:
                  value:
                    error: "validation failed: toUser and content are required"
                fromUserEqualsToUser:
                  value:
                    error: you cannot send a message to yourself
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                missingAuthorizationHeader:
                  value:
                    error: missing authorization header
                invalidAuthorizationHeader:
                  value:
                    error: invalid authorization header
                invalidOrExpiredToken:
                  value:
                    error: invalid or expired token
                unauthorized:
                  value:
                    error: unauthorized
        '404':
          description: Recipient user not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: user not found
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: internal server error

  /api/peers:
    get:
      tags: [Messages]
      summary: List conversation peers for the authenticated user
      description: Returns usernames you have at least one message with (in either direction), sorted by most recent activity.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: List of peers (may be empty)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Peer'
              example:
                - username: ivan
                  lastMessageAt: '2026-05-13T12:00:00.000Z'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: unauthorized
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: internal server error

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    RegisterRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
          minLength: 3
          example: leonid
        password:
          type: string
          minLength: 8
          example: supersecret123
    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
          example: leonid
        password:
          type: string
          example: supersecret123
    LoginResponse:
      type: object
      required: [token]
      properties:
        token:
          type: string
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
    SendMessageRequest:
      type: object
      required: [toUser, content]
      properties:
        toUser:
          type: string
          example: ivan
        content:
          type: string
          example: Hello!
    MessageResponse:
      type: object
      required: [message]
      properties:
        message:
          type: string
    PrivateDataResponse:
      type: object
      required: [message, user]
      properties:
        message:
          type: string
        user:
          type: string
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: string
    Peer:
      type: object
      required: [username, lastMessageAt]
      properties:
        username:
          type: string
          example: ivan
        lastMessageAt:
          type: string
          format: date-time
